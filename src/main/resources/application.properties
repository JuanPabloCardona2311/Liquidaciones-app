# MySQL datasource
spring.datasource.url=jdbc:mysql://demo-camiones.cnya0sok46wg.us-east-2.rds.amazonaws.com:3306/liquidaciones?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=admin
spring.datasource.password=Luis2311*
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP connection pool - Robusto para AWS RDS
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.auto-commit=true
spring.datasource.hikari.test-on-borrow=true

# JPA/Hibernate - Crear tablas automaticamente si no existen, actualizar si existen
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

